### Secret values below can be plaintext OR encrypted.
### To encrypt: set the CONFIG_ENCRYPTION_KEY env var to a passphrase, then run
###   mvn exec:java -D exec.mainClass=org.example.ConfigEncryptorMain -D exec.args="the-plaintext-value"
### and paste the printed ENC(...) output as the property value below, e.g.:
###   luxmed.password=ENC(base64ciphertext...)
### ConfigReader decrypts any ENC(...) value at startup using the same env var - it must be
### set in the environment that runs the app whenever config.properties contains ENC(...) values.

luxmed.username=your.email@example.com
luxmed.password=your-luxmed-password
gmail.app.password=your-gmail-app-password
gmail.app.mail=your.email@gmail.com

# telegram bot credentials, see https://rieckpil.de/howto-send-telegram-bot-notifications-with-java/
telegram.bot.token=your-telegram-bot-token
telegram.chat.id=your-telegram-chat-id

# loop repeat intervals and waiting time
loop.retry.max = 5000
loop.retry.interval.minutes = 3
noemail.sleep.interval = 15

### Configuration ###
### turn this proxy to true if you are behind a proxy which blocks playwright to be downloaded,
### then you can download chromedriver manually from here https://developer.chrome.com/docs/chromedriver/downloads
### and provide a path to chrome.exe
is.proxy = true
### path with backspashes, or double slashes
browser.chrome.path = C:/path/to/chrome-win/chrome.exe
browser.headless = false
